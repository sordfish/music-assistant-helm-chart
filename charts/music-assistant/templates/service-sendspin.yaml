apiVersion: v1
kind: Service
metadata:
  name: {{ include "music-assistant.fullname" . }}-sendspin
  labels:
    {{- include "music-assistant.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.sendspin.type }}
  ports:
    - port: {{ .Values.service.sendspin.port }}
      targetPort: sendspin
      protocol: TCP
      name: sendspin   
  selector:
    {{- include "music-assistant.selectorLabels" . | nindent 4 }}
